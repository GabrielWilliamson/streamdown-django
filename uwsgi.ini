[uwsgi]
chdir = /app
module = config.wsgi:application
master = true
enable-threads = true
need-app = true
lazy-apps = true
vacuum = true
die-on-term = true
http = 0.0.0.0:$(PORT)
http-timeout = 300
http-keepalive = 1
http-auto-chunked = true
add-header = Connection: keep-alive
harakiri = 300
buffer-size = 65535
post-buffering = 1
offload-threads = 4
